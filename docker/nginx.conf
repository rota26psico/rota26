# Junta GoTrue e PostgREST sob uma origem só, como o Kong faz no Supabase.
# O supabase-js espera exatamente estes dois prefixos.
#
# CORS: a página roda em http://localhost:3000 e chama http://localhost:8000 —
# origens diferentes. O PostgREST responde CORS sozinho. O GoTrue põe os
# headers nas respostas reais, mas NÃO responde ao preflight OPTIONS — e sem
# isso o `auth.getUser()` do navegador falha em silêncio. Quando isso acontece,
# `garantirParticipante` grava o participante com user_id nulo e a policy de
# insert de `avaliacoes` passa a barrar tudo, porque `meu_participante_id()`
# não encontra ninguém.
#
# O nginx responde APENAS ao preflight. Nas respostas reais quem manda os
# headers é o GoTrue: duplicar Access-Control-Allow-Origin faz o navegador
# rejeitar a resposta.
map $http_origin $cors_origin {
  default "";
  "~^http://localhost:\d+$" $http_origin;
  "~^http://127\.0\.0\.1:\d+$" $http_origin;
}

server {
  listen 8000;
  server_name _;

  location /auth/v1/ {
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin $cors_origin always;
      add_header Access-Control-Allow-Credentials true always;
      add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
      add_header Access-Control-Allow-Headers "authorization, apikey, content-type, x-client-info, x-supabase-api-version, accept, accept-language" always;
      add_header Access-Control-Max-Age 86400 always;
      add_header Content-Length 0 always;
      return 204;
    }
    proxy_pass http://auth:9999/;
    proxy_set_header Host $host;
  }

  location /rest/v1/ {
    proxy_pass http://rest:3000/;
    proxy_set_header Host $host;
    # O PostgREST lê o JWT do Authorization; o supabase-js manda a anon key em
    # `apikey` e o token da sessão em `Authorization`.
    proxy_set_header Authorization $http_authorization;
  }

  location = /health { return 200 'ok'; add_header Content-Type text/plain; }
}
