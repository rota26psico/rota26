# ============================================================================
# STACK LOCAL DO ROTA26 — infraestrutura de desenvolvimento.
# ----------------------------------------------------------------------------
# Sobe o equivalente auto-hospedado do Supabase que a aplicação espera:
#   db      PostgreSQL 16 (as views usam security_invoker → exige 15+)
#   auth    GoTrue — cria o schema `auth` e emite os JWT da sessão
#   rest    PostgREST — é a ele que o supabase-js fala, com o RLS valendo
#   gateway nginx — junta /auth/v1 e /rest/v1 sob uma única origem
#   app     Next.js em modo dev
#
# NÃO é ambiente de produção: senhas fixas, e-mail auto-confirmado e uma rota
# de login de desenvolvimento montada só dentro do container.
# ============================================================================
name: rota26

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 3s
      timeout: 5s
      retries: 20
    ports: ["54322:5432"]

  auth:
    image: supabase/gotrue:v2.158.1
    depends_on:
      db: { condition: service_healthy }
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      PORT: 9999
      API_EXTERNAL_URL: http://localhost:8000
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:postgres@db:5432/postgres?search_path=auth&sslmode=disable
      GOTRUE_SITE_URL: http://localhost:3000
      GOTRUE_URI_ALLOW_LIST: "*"
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      # Sessão de quem responde. Equivale a Authentication → Sign In / Providers
      # → Anonymous sign-ins no painel do Supabase. Sem isto, /questionario não
      # consegue abrir sessão e o RLS devolve zero setores.
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "true"
      # O padrão do Supabase é 30 por hora POR IP. Uma equipe inteira atrás do
      # mesmo NAT corporativo estoura isso — o mesmo ajuste precisa ser feito no
      # painel, em Authentication → Rate Limits, antes da aplicação em massa.
      GOTRUE_RATE_LIMIT_ANONYMOUS_USERS: "500"
      GOTRUE_LOG_LEVEL: warn
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9999/health"]
      interval: 3s
      timeout: 5s
      retries: 30

  # Aplica o SQL do projeto DEPOIS que o GoTrue criou o schema `auth`,
  # porque 01_schema.sql tem FK para auth.users(id).
  migrate:
    image: postgres:16-alpine
    depends_on:
      auth: { condition: service_healthy }
    environment:
      PGPASSWORD: postgres
      MASTER_EMAIL: ${MASTER_EMAIL}
      MASTER_PASSWORD: ${MASTER_PASSWORD}
      SERVICE_KEY: ${SERVICE_KEY}
    volumes:
      - ../supabase:/sql/projeto:ro
      - ./sql:/sql/local:ro
      - ./migrate.sh:/migrate.sh:ro
    entrypoint: ["sh", "/migrate.sh"]
    restart: "no"

  rest:
    image: postgrest/postgrest:v12.2.3
    depends_on:
      migrate: { condition: service_completed_successfully }
    environment:
      PGRST_DB_URI: postgres://authenticator:postgres@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"

  # O gateway é o DONO do namespace de rede que o `app` compartilha. Assim
  # `http://localhost:8000` significa a MESMA coisa no navegador e dentro do
  # servidor Next — é o que permite uma única NEXT_PUBLIC_SUPABASE_URL nos dois
  # lados. O dono precisa ser o nginx, e não o app: reiniciar o app é rotina, e
  # reiniciar o dono do namespace derrubaria o outro container.
  gateway:
    image: nginx:1.27-alpine
    depends_on: [auth, rest]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["3000:3000", "8000:8000"]

  app:
    image: node:22-bookworm-slim
    network_mode: "service:gateway"
    depends_on:
      migrate: { condition: service_completed_successfully }
      gateway: { condition: service_started }
    working_dir: /app
    user: "1000:1000"
    environment:
      NEXT_PUBLIC_APP_MODE: development
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:8000
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_KEY}
      MASTER_EMAIL: ${MASTER_EMAIL}
      MASTER_PASSWORD: ${MASTER_PASSWORD}
      HOSTNAME: 0.0.0.0
      npm_config_cache: /tmp/npmcache
    volumes:
      - ..:/app
      # Rota de login SÓ DE DESENVOLVIMENTO: o app não tem tela de login própria.
      # Monta-se o DIRETÓRIO, não o arquivo. Como `..:/app` já cobre o projeto
      # inteiro, um mount de arquivo faz o Docker criar o alvo no host — e um
      # `route.ts` vazio, dono root, quebra `next build` com "File ... is not a
      # module". Mount de diretório não cria arquivo nenhum no diretório do
      # projeto; a rota existe só dentro do container.
      - ./dev-login:/app/src/app/api/dev-login:ro
      # `.next` do container fica fora do `.next` do projeto. Sem isto, o
      # `next dev` do container escreve `.next/types` declarando a rota de
      # desenvolvimento — e o `npm run typecheck` da máquina, que não enxerga
      # essa rota, passa a falhar por um arquivo que nem existe aqui. É bind de
      # diretório do host, e não volume nomeado, porque volume nomeado nasce do
      # root e o container roda como 1000 (EACCES em /app/.next).
      # `docker/next-cache` está no `exclude` do tsconfig.json.
      - ./next-cache:/app/.next
    command: ["npx", "next", "dev", "-H", "0.0.0.0", "-p", "3000"]

volumes:
  db-data:
