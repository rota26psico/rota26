<script>
const D = {"QUESTOES":[{"id":"R001","n":1,"e":"Pedem que você contribua com um projeto ainda em fase de ideia. Qual é a sua entrada?","a":[{"id":"R001A","t":"Aponto o que aquilo pode se tornar, mesmo que ainda não haja sinal disso."},{"id":"R001B","t":"Junto referências de fora e mostro combinações que ninguém tinha considerado."},{"id":"R001C","t":"Sugiro tirar do papel um pedaço pequeno agora, para ver o que acontece."},{"id":"R001D","t":"Testo a consistência da premissa: se ela não se sustenta, o resto não importa."}]},{"id":"R002","n":2,"e":"Uma decisão técnica correta terá custo alto para algumas pessoas. Como você se posiciona?","a":[{"id":"R002A","t":"Se o custo recair sobre quem não pode absorvê-lo, sou contra."},{"id":"R002B","t":"Sustento a decisão correta e trato o custo como assunto separado."},{"id":"R002C","t":"Procuro uma terceira via que a disputa entre custo e correção não considerou."},{"id":"R002D","t":"Levanto esse custo antes de a decisão fechar, e proponho como reduzi-lo."}]},{"id":"R003","n":3,"e":"Sua rotina de trabalho está muito previsível há alguns meses. Como você lida com isso?","a":[{"id":"R003A","t":"Uso a calmaria para pensar no que vem depois e nos preparar para isso."},{"id":"R003B","t":"Uso a folga para estruturar o que sempre ficou pendente de organização."},{"id":"R003C","t":"Procuro alguma frente nova para entrar, mesmo que não seja exatamente a minha área."},{"id":"R003D","t":"Aproveito para deixar tudo em ordem e melhorar o que estava mal acabado."}]},{"id":"R004","n":4,"e":"Você discorda de uma conclusão apresentada com muita segurança pela equipe. Como se manifesta?","a":[{"id":"R004A","t":"Mostro onde o raciocínio não fecha, com calma e sem disputar a conversa."},{"id":"R004B","t":"Confiro os registros do que de fato aconteceu antes de contestar."},{"id":"R004C","t":"Levanto a dúvida de um jeito que não desautorize quem apresentou."},{"id":"R004D","t":"Digo o que essa conclusão vai produzir mais adiante, e deixo o grupo concluir."}]},{"id":"R005","n":5,"e":"Duas áreas discordam sobre de quem era a responsabilidade por um atraso. Como você entra?","a":[{"id":"R005A","t":"Volto ao que ficou combinado e mostro onde a responsabilidade estava definida."},{"id":"R005B","t":"Procuro em separado quem está levando a maior parte da cobrança."},{"id":"R005C","t":"Reconstruo a sequência dos fatos até achar onde a cadeia se rompeu."},{"id":"R005D","t":"Deixo a disputa para depois e cuido primeiro de destravar a entrega."}]},{"id":"R006","n":6,"e":"A equipe discute há tempo demais e nada saiu do lugar. O que você faz?","a":[{"id":"R006A","t":"Proponho parar de discutir e experimentar a versão mais simples hoje mesmo."},{"id":"R006B","t":"Verifico o que ainda não foi dito e está segurando o grupo."},{"id":"R006C","t":"Retomo o que já foi decidido antes sobre isso; parte da discussão é repetição."},{"id":"R006D","t":"Digo qual dos caminhos discutidos é o único que se sustenta adiante."}]},{"id":"R007","n":7,"e":"Sob pressão de prazo, sugerem pular etapas de conferência. Qual é a sua posição?","a":[{"id":"R007A","t":"Sigo em frente e corrijo o que aparecer, em vez de travar por precaução."},{"id":"R007B","t":"Etapa de conferência não se pula: é justamente sob pressa que o erro passa."},{"id":"R007C","t":"Recuso entregar mal aquilo que, para mim, não se entrega mal — mesmo ficando sozinho nisso."},{"id":"R007D","t":"Pergunto o que esse atalho vai cobrar depois, e se estamos dispostos a pagar."}]},{"id":"R008","n":8,"e":"Você recebe um trabalho que não considera relevante, mas que precisa ser feito. Como conduz?","a":[{"id":"R008A","t":"Faço, porque foi combinado, e registro por que acho que não deveria existir."},{"id":"R008B","t":"Faço bem-feito de qualquer forma, mas não finjo entusiasmo que não tenho."},{"id":"R008C","t":"Faço, e evito manifestar desânimo para não contaminar quem está junto."},{"id":"R008D","t":"Faço rápido e tiro da frente, para voltar ao que importa."}]},{"id":"R009","n":9,"e":"Um erro chegou ao cliente e a equipe discute de quem foi. O que você faz?","a":[{"id":"R009A","t":"Seguro a caça às bruxas: com medo instalado, ninguém vai relatar o próximo."},{"id":"R009B","t":"Aponto que esse erro é sintoma de algo que ainda vai se repetir."},{"id":"R009C","t":"Refaço o caminho do erro para saber exatamente em que ponto ele entrou."},{"id":"R009D","t":"Trato primeiro da correção e da responsabilidade, nessa ordem."}]},{"id":"R010","n":10,"e":"Como você costuma organizar o seu próprio trabalho ao longo da semana?","a":[{"id":"R010A","t":"Vou resolvendo conforme aparece; o que é urgente se impõe sozinho."},{"id":"R010B","t":"Mantenho uma rotina estável e trabalho melhor quando ela é respeitada."},{"id":"R010C","t":"Deixo espaço em aberto de propósito; o mais interessante costuma não estar previsto."},{"id":"R010D","t":"Planejo a semana inteira e sigo o plano, ajustando quando há motivo."}]},{"id":"R011","n":11,"e":"Você precisa dar um retorno difícil sobre o trabalho de um colega. Como conduz?","a":[{"id":"R011A","t":"Sou direto sobre o que não atendeu ao combinado e sobre o que precisa mudar."},{"id":"R011B","t":"Digo pouco, mas não digo nada de que eu não esteja convencido."},{"id":"R011C","t":"Cuido do modo de dizer: o que eu falar precisa manter a pessoa disposta a continuar."},{"id":"R011D","t":"Aponto exatamente onde está o problema, ponto por ponto, sem generalizar."}]},{"id":"R012","n":12,"e":"Pedem seu parecer sobre um plano detalhado que já está pronto. O que você olha primeiro?","a":[{"id":"R012A","t":"Se os detalhes fecham: prazos, responsáveis e o que depende do quê."},{"id":"R012B","t":"Se a direção está certa. Um plano bem-feito na direção errada continua errado."},{"id":"R012C","t":"Se as premissas se sustentam quando examinadas uma a uma."},{"id":"R012D","t":"Se ele respeita quem vai ser afetado por ele."}]},{"id":"R013","n":13,"e":"Um colega está passando por um momento difícil e o trabalho dele começou a cair. O que você faz?","a":[{"id":"R013A","t":"Percebo que isso vinha se anunciando há um tempo, e trato disso, não do episódio."},{"id":"R013B","t":"Fico por perto e sustento o que der, sem transformar isso em assunto de todos."},{"id":"R013C","t":"Assumo na prática a parte que está parada, e conversamos depois."},{"id":"R013D","t":"Converso com a equipe para redistribuirmos a carga enquanto ele se recompõe."}]},{"id":"R014","n":14,"e":"Você é chamado a opinar sobre uma proposta que acabou de conhecer. Como responde?","a":[{"id":"R014A","t":"Digo aonde aquilo vai levar se for adiante do jeito que está."},{"id":"R014B","t":"Dou minha impressão imediata e ajusto conforme a conversa avança."},{"id":"R014C","t":"Peço tempo: só me posiciono depois de examinar se ela se sustenta por dentro."},{"id":"R014D","t":"Respondo pelo que aquilo poderia virar, mais do que pelo que é hoje."}]},{"id":"R015","n":15,"e":"O prazo apertou e cada um começou a decidir por conta própria. Qual é a sua reação?","a":[{"id":"R015A","t":"Assumo pessoalmente a frente mais travada enquanto os outros seguem."},{"id":"R015B","t":"Reúno todos por dez minutos, antes que o desencontro cresça."},{"id":"R015C","t":"Sinalizo o que essa pressa vai custar depois e o que não pode ser abandonado."},{"id":"R015D","t":"Retomo a sequência: quem decide o quê, e o que não se decide sozinho."}]},{"id":"R016","n":16,"e":"Você discorda de uma regra que considera engessada. Como lida com ela?","a":[{"id":"R016A","t":"Faço do jeito que resolve e explico depois, se alguém cobrar."},{"id":"R016B","t":"Cumpro. Regra existe por algum motivo, mesmo que eu não veja qual."},{"id":"R016C","t":"Cumpro no que não me contradiz, e não cumpro no que me contradiz."},{"id":"R016D","t":"Procuro o espaço que a regra deixa e trabalho por ali, sem bater de frente."}]},{"id":"R017","n":17,"e":"Um trabalho conjunto começa e ainda não está claro quem responde por cada parte. Qual é a sua primeira reação?","a":[{"id":"R017A","t":"Levanto quem, fora da equipe, já passou por algo parecido e pode encurtar o caminho."},{"id":"R017B","t":"Retomo como isso foi dividido da última vez e reaproveito o que deu certo."},{"id":"R017C","t":"Defino quem responde por cada parte e em que ordem, antes que alguém comece."},{"id":"R017D","t":"Pergunto a cada um o que prefere assumir, para ninguém ficar com o que não sustenta."}]},{"id":"R018","n":18,"e":"Alguém questiona publicamente uma análise sua. Qual é a sua reação mais provável?","a":[{"id":"R018A","t":"Incomoda mais pelo modo do que pelo conteúdo, mas não demonstro."},{"id":"R018B","t":"Deixo passar: o tempo costuma responder isso melhor do que eu responderia agora."},{"id":"R018C","t":"Examino o argumento com seriedade; se ele tiver razão, mudo de posição."},{"id":"R018D","t":"Proponho verificar na prática quem está certo, em vez de discutir."}]},{"id":"R019","n":19,"e":"Você recebe um trabalho que já passou por outras mãos antes de chegar até você. Como começa?","a":[{"id":"R019A","t":"Procuro a lógica que quem começou usou, para não quebrar a coerência."},{"id":"R019B","t":"Confiro tudo desde o início — não sigo em cima do que não verifiquei."},{"id":"R019C","t":"Faço no meu ritmo e do meu jeito; entrego quando estiver como eu aceito entregar."},{"id":"R019D","t":"Olho o todo rapidamente e vou atrás do que parece a maior oportunidade ali."}]},{"id":"R020","n":20,"e":"Uma decisão do grupo contraria algo que você considera importante. O que costuma fazer?","a":[{"id":"R020A","t":"Contesto abertamente e peço que o critério da decisão seja explicitado."},{"id":"R020B","t":"Aguardo: em pouco tempo a própria decisão vai mostrar o que ela custa."},{"id":"R020C","t":"Procuro uma formulação que preserve o que importa sem rachar o grupo."},{"id":"R020D","t":"Não entro na discussão, mas também não sustento na prática aquilo que não acho certo."}]},{"id":"R021","n":21,"e":"Você tem quinze minutos com uma pessoa de outra área que pouco conhece. Como usa esse tempo?","a":[{"id":"R021A","t":"Prefiro ouvir mais do que falar, e só me abro se houver alguma sintonia."},{"id":"R021B","t":"Trato do que precisa ser resolvido entre as duas áreas e saio com um encaminhamento."},{"id":"R021C","t":"Aproveito para entender como funciona a parte que eu conheço menos."},{"id":"R021D","t":"Puxo assunto amplo para descobrir onde os nossos trabalhos podem se cruzar."}]},{"id":"R022","n":22,"e":"Você percebe que a decisão só ficará clara depois de algo ser tentado. O que faz?","a":[{"id":"R022A","t":"Prefiro esperar: o tempo costuma revelar isso sem custo de tentativa."},{"id":"R022B","t":"Tento logo, em escala pequena, e deixo o resultado decidir."},{"id":"R022C","t":"Antes de testar, penso em duas ou três variações para testar junto."},{"id":"R022D","t":"Antes de tentar, defino o que exatamente o teste precisa responder."}]},{"id":"R023","n":23,"e":"Você vai distribuir as tarefas de um trabalho coletivo. O que orienta a divisão?","a":[{"id":"R023A","t":"O que cada pessoa faz melhor e onde cada uma vai se sentir útil."},{"id":"R023B","t":"Quem se importa de verdade com cada parte — isso costuma render mais que aptidão."},{"id":"R023C","t":"Quem domina de fato o assunto de cada parte."},{"id":"R023D","t":"Quem está disponível agora — divido e vamos ajustando no caminho."}]},{"id":"R024","n":24,"e":"Um conflito se repete na equipe sob formas diferentes. Como você o enxerga?","a":[{"id":"R024A","t":"Como algo que já aconteceu antes e foi resolvido de um jeito que funcionou."},{"id":"R024B","t":"Como falha de definição: onde não há regra clara, o atrito se instala."},{"id":"R024C","t":"Como desgaste de relação que precisa ser cuidado antes de virar ruptura."},{"id":"R024D","t":"Como sinal de uma causa que ninguém tocou; enquanto ela ficar, o conflito volta."}]},{"id":"R025","n":25,"e":"Alguém da equipe entrega sistematicamente abaixo do padrão combinado. Como você age?","a":[{"id":"R025A","t":"Proponho trocar a atribuição por outra em que a pessoa renda mais."},{"id":"R025B","t":"Reviso a entrega ponto a ponto e devolvo o que precisa ser corrigido."},{"id":"R025C","t":"Tento entender o que está acontecendo com ela antes de tratar da entrega."},{"id":"R025D","t":"Trato direto com a pessoa: qual é o padrão e o que falta para alcançá-lo."}]},{"id":"R026","n":26,"e":"Como você costuma se posicionar em uma conversa profissional que ainda está aberta?","a":[{"id":"R026A","t":"Falo cedo, coloco o que penso e vou ajustando conforme os outros reagem."},{"id":"R026B","t":"Presto atenção em como a conversa está indo antes de entrar."},{"id":"R026C","t":"Só entro quando tenho algo examinado a dizer, não uma impressão."},{"id":"R026D","t":"Espero até formar a leitura inteira, e aí falo uma vez só."}]},{"id":"R027","n":27,"e":"A equipe precisa de alguém que domine a fundo um assunto específico. Como você se posiciona?","a":[{"id":"R027A","t":"Assumo com gosto: gosto de conhecer um assunto até o fim, não pela metade."},{"id":"R027B","t":"Assumo se for um assunto que me importa; por obrigação, não vai longe."},{"id":"R027C","t":"Prefiro achar quem já domina e trazer essa pessoa para perto."},{"id":"R027D","t":"Assumo se for algo que eu já pratico há tempo e sei fazer bem."}]},{"id":"R028","n":28,"e":"Pedem que você defenda publicamente uma posição da equipe. Como você se coloca?","a":[{"id":"R028A","t":"Defendo, mas abro as outras leituras possíveis junto."},{"id":"R028B","t":"Defendo, porque o grupo precisa aparecer unido nesse momento."},{"id":"R028C","t":"Defendo com o critério que sustenta a posição, independentemente do que eu ache."},{"id":"R028D","t":"Defendo se for coerente com o que penso; se não for, prefiro que outra pessoa fale."}]},{"id":"R029","n":29,"e":"A equipe está sobrecarregada e começa a se desentender por coisas pequenas. O que você faz?","a":[{"id":"R029A","t":"Cuido do clima antes de cuidar da tarefa — sem isso, o resto não anda."},{"id":"R029B","t":"Sinalizo aonde essa sobrecarga leva se continuar, para a escolha ser consciente."},{"id":"R029C","t":"Coloco a mão no que está mais pesado, para aliviar de verdade e não no discurso."},{"id":"R029D","t":"Mostro friamente o que não cabe no prazo, para que a conversa saia do achismo."}]},{"id":"R030","n":30,"e":"Você vai relatar o andamento de um trabalho para quem não acompanha o dia a dia. Como faz?","a":[{"id":"R030A","t":"Aproveito para mostrar aonde isso pode chegar, além do combinado."},{"id":"R030B","t":"Relato o que foi feito, com precisão e sem arredondar o que ainda falta."},{"id":"R030C","t":"Faço questão de dar nome a quem contribuiu em cada parte."},{"id":"R030D","t":"Relato sem enfeitar. Prefiro dar notícia ruim a dar notícia arredondada."}]},{"id":"R031","n":31,"e":"Em um grupo grande discutindo um tema amplo, qual é o seu lugar mais frequente?","a":[{"id":"R031A","t":"Fico atento a quem não conseguiu falar e abro espaço para essa pessoa."},{"id":"R031B","t":"Puxo o grupo para uma conclusão, senão a discussão não termina."},{"id":"R031C","t":"Sou dos que mais falam: penso enquanto converso e a ideia vai se formando."},{"id":"R031D","t":"Falo pouco, e quando falo é para nomear o que está por baixo da discussão."}]},{"id":"R032","n":32,"e":"O plano falhou e é preciso apresentar uma saída rapidamente. Como você contribui?","a":[{"id":"R032A","t":"Verifico o que não pode ser sacrificado na pressa, e seguro isso."},{"id":"R032B","t":"Escolho a saída viável e organizo a execução imediatamente."},{"id":"R032C","t":"Gero várias saídas em pouco tempo, mesmo sabendo que a maioria será descartada."},{"id":"R032D","t":"Volto ao último ponto em que estava tudo estável e recomeço dali."}]},{"id":"R033","n":33,"e":"Você tem uma ideia que considera boa, mas que ainda não convence ninguém. O que faz?","a":[{"id":"R033A","t":"Reviso a ideia: se não convence, talvez ainda haja um vão nela."},{"id":"R033B","t":"Guardo e sigo sustentando por conta própria; se for boa, uma hora aparece."},{"id":"R033C","t":"Transformo em proposta com número e prazo — sem isso não convence mesmo."},{"id":"R033D","t":"Levo a mais gente, em outros lugares, até encontrar quem se interesse."}]},{"id":"R034","n":34,"e":"Você precisa decidir sobre algo parecido com uma situação que já viveu. O que usa?","a":[{"id":"R034A","t":"Desconfio da semelhança: o que muda entre os dois casos costuma ser o essencial."},{"id":"R034B","t":"O que já deu certo antes. Experiência vale mais do que hipótese."},{"id":"R034C","t":"Justamente por já conhecer, aproveito para tentar de outro jeito."},{"id":"R034D","t":"Verifico se a lógica de então continua valendo neste caso."}]},{"id":"R035","n":35,"e":"Uma proposta nova é apresentada com entusiasmo pela equipe. Qual é a sua contribuição?","a":[{"id":"R035A","t":"Cuido para que a avaliação crítica não desmonte a energia do grupo."},{"id":"R035B","t":"Pergunto quem faz, com o que, até quando — entusiasmo não executa."},{"id":"R035C","t":"Aponto onde ela pode não se sustentar, mesmo sabendo que isso esfria a conversa."},{"id":"R035D","t":"Somo ao entusiasmo e mostro outros caminhos que a proposta abre."}]},{"id":"R036","n":36,"e":"O clima da equipe azedou depois de uma discussão pública. O que você faz nos dias seguintes?","a":[{"id":"R036A","t":"Separo o que era desacordo real do que foi ruído, para tratar do que importa."},{"id":"R036B","t":"Retomo o assunto pelo mérito e encerro a pendência com uma decisão."},{"id":"R036C","t":"Circulo, converso com cada lado e vou recosturando o que se rompeu."},{"id":"R036D","t":"Procuro quem saiu mais machucado, sem fazer disso um movimento visível."}]},{"id":"R037","n":37,"e":"A equipe está reagindo a uma sequência de urgências e você percebe que isso já vem de longe. O que faz?","a":[{"id":"R037A","t":"Foco em apagar o incêndio da vez; padrão a gente discute depois."},{"id":"R037B","t":"Aponto o padrão que está gerando as urgências, mesmo que ninguém queira ouvir agora."},{"id":"R037C","t":"Estabeleço prioridade e ordem, para parar de reagir a tudo ao mesmo tempo."},{"id":"R037D","t":"Volto ao que costumava funcionar antes de esse ciclo começar."}]},{"id":"R038","n":38,"e":"Surge uma ferramenta nova que talvez ajude o trabalho da equipe. Qual é a sua atitude?","a":[{"id":"R038A","t":"Uso e descubro fazendo — aprendo mais em meia hora de uso do que lendo sobre ela."},{"id":"R038B","t":"Espero que amadureça: o que já usamos funciona e ainda não vi motivo para trocar."},{"id":"R038C","t":"Imagino outros usos além do que ela promete, e é isso que me interessa nela."},{"id":"R038D","t":"Estudo como ela funciona por dentro antes de confiar o trabalho a ela."}]},{"id":"R039","n":39,"e":"É preciso aprovar ou recusar algo, e a informação disponível é incompleta. Como decide?","a":[{"id":"R039A","t":"Procuro uma terceira saída que a proposta, como veio, não contemplava."},{"id":"R039B","t":"Decido pelo critério já definido para casos assim, e registro a decisão."},{"id":"R039C","t":"Não decido enquanto a lacuna que mais pesa não estiver fechada."},{"id":"R039D","t":"Aprovo em escala pequena, para ver na prática o que a informação não diz."}]},{"id":"R040","n":40,"e":"A solução que a equipe sempre usou deixou de dar conta. Por onde você começa?","a":[{"id":"R040A","t":"Ajusto o que já existe até voltar a funcionar, em vez de trocar tudo."},{"id":"R040B","t":"Vou buscar fora: outras áreas, outras empresas, gente que resolveu isso de outro jeito."},{"id":"R040C","t":"Testo duas ou três saídas rápidas e vejo, na prática, qual reage melhor."},{"id":"R040D","t":"Examino por que ela funcionava antes, para saber o que exatamente parou de valer."}]},{"id":"R041","n":41,"e":"A equipe precisa de alguém que puxe a execução de uma frente parada. Como você entra?","a":[{"id":"R041A","t":"Entro fazendo: começo pela primeira coisa concreta e o resto vem atrás."},{"id":"R041B","t":"Entro pelas pessoas: descubro o que desanimou o grupo e trato disso."},{"id":"R041C","t":"Entro organizando: defino as etapas e distribuo antes de qualquer movimento."},{"id":"R041D","t":"Entro perguntando se essa frente ainda faz sentido antes de retomá-la."}]},{"id":"R042","n":42,"e":"Uma mudança no jeito de trabalhar foi aprovada e agora precisa ser adotada. Do que você cuida?","a":[{"id":"R042A","t":"De preservar o que funcionava bem e não jogar fora junto com o resto."},{"id":"R042B","t":"De começar a fazer do jeito novo já, para o exemplo puxar os outros."},{"id":"R042C","t":"De trazer as pessoas junto: mudança que o grupo não comprou não pega."},{"id":"R042D","t":"De não perder de vista aonde essa mudança nos leva depois da adoção."}]},{"id":"R043","n":43,"e":"Há duas alternativas viáveis e a equipe está dividida. O que mais pesa para você?","a":[{"id":"R043A","t":"Qual delas é consistente com o critério que já usamos em casos parecidos."},{"id":"R043B","t":"Qual delas eu conseguiria defender sem me contradizer."},{"id":"R043C","t":"Qual das duas ainda estará de pé daqui a dois anos."},{"id":"R043D","t":"Qual delas conseguimos colocar de pé mais rápido e corrigir andando."}]},{"id":"R044","n":44,"e":"Propõem substituir um processo que você conhece bem por outro ainda não testado aqui. O que você diz?","a":[{"id":"R044A","t":"Quero entender a lógica do novo antes de opinar a favor ou contra."},{"id":"R044B","t":"Pergunto para onde o novo processo nos leva daqui a alguns anos."},{"id":"R044C","t":"Apoio: o processo atual já mostrou seu limite, e o novo abre outras portas."},{"id":"R044D","t":"Peço para rodar os dois em paralelo antes de abandonar o que funciona."}]},{"id":"R045","n":45,"e":"Sob pressão intensa, como as pessoas ao seu redor costumam perceber você?","a":[{"id":"R045A","t":"Mais metódico: quando aperta, eu me agarro ao procedimento."},{"id":"R045B","t":"Mais atento aos outros, tentando manter todo mundo inteiro."},{"id":"R045C","t":"Mais quieto do que o normal — processo por dentro e falo pouco."},{"id":"R045D","t":"Mais em movimento: quando aperta, eu ajo."}]},{"id":"R046","n":46,"e":"Uma oportunidade aparece fora do que estava planejado. Como você a trata?","a":[{"id":"R046A","t":"Deixo passar. Assumir isso agora comprometeria o que já está em curso."},{"id":"R046B","t":"Avalio contra o que já está comprometido e decido pelo custo de trocar."},{"id":"R046C","t":"Só entro se aquilo fizer sentido para mim, não só por ser uma oportunidade."},{"id":"R046D","t":"Vou atrás dela: plano se refaz, oportunidade dessas costuma não voltar."}]},{"id":"R047","n":47,"e":"Você precisa comunicar uma mudança que vai desagradar parte da equipe. Como faz?","a":[{"id":"R047A","t":"Explico o critério que levou à mudança e o que muda na prática para cada um."},{"id":"R047B","t":"Preparo a explicação até ela se sustentar diante de qualquer pergunta."},{"id":"R047C","t":"Falo antes com quem será mais afetado, e só depois anuncio ao grupo."},{"id":"R047D","t":"Digo também o que eu penso da mudança, mesmo que isso me custe."}]},{"id":"R048","n":48,"e":"Sob pressão, pedem uma resposta sua imediata sobre um assunto complexo. Como reage?","a":[{"id":"R048A","t":"Digo para onde a pergunta aponta, mesmo sem ter a resposta exata que pediram."},{"id":"R048B","t":"Respondo com o que tenho e sigo — dá para corrigir andando."},{"id":"R048C","t":"Ganho tempo sem deixar quem perguntou desamparado."},{"id":"R048D","t":"Digo com franqueza o que sei e o que não sei, e não invento o que falta."}]}],"MAPA":{"R001A":"Ni","R001B":"Ne","R001C":"Se","R001D":"Ti","R002A":"Fi","R002B":"Ti","R002C":"Ne","R002D":"Fe","R003A":"Ni","R003B":"Te","R003C":"Ne","R003D":"Si","R004A":"Ti","R004B":"Si","R004C":"Fe","R004D":"Ni","R005A":"Te","R005B":"Fi","R005C":"Ti","R005D":"Se","R006A":"Se","R006B":"Fe","R006C":"Si","R006D":"Ni","R007A":"Se","R007B":"Si","R007C":"Fi","R007D":"Ni","R008A":"Te","R008B":"Fi","R008C":"Fe","R008D":"Se","R009A":"Fe","R009B":"Ni","R009C":"Si","R009D":"Te","R010A":"Se","R010B":"Si","R010C":"Ne","R010D":"Te","R011A":"Te","R011B":"Fi","R011C":"Fe","R011D":"Si","R012A":"Si","R012B":"Ni","R012C":"Ti","R012D":"Fi","R013A":"Ni","R013B":"Fi","R013C":"Se","R013D":"Fe","R014A":"Ni","R014B":"Se","R014C":"Ti","R014D":"Ne","R015A":"Se","R015B":"Fe","R015C":"Ni","R015D":"Te","R016A":"Se","R016B":"Si","R016C":"Fi","R016D":"Ne","R017A":"Ne","R017B":"Si","R017C":"Te","R017D":"Fe","R018A":"Fi","R018B":"Ni","R018C":"Ti","R018D":"Se","R019A":"Ti","R019B":"Si","R019C":"Fi","R019D":"Ne","R020A":"Te","R020B":"Ni","R020C":"Fe","R020D":"Fi","R021A":"Fi","R021B":"Te","R021C":"Ti","R021D":"Ne","R022A":"Ni","R022B":"Se","R022C":"Ne","R022D":"Ti","R023A":"Fe","R023B":"Fi","R023C":"Ti","R023D":"Se","R024A":"Si","R024B":"Te","R024C":"Fe","R024D":"Ni","R025A":"Ne","R025B":"Si","R025C":"Fi","R025D":"Te","R026A":"Se","R026B":"Fe","R026C":"Ti","R026D":"Ni","R027A":"Ti","R027B":"Fi","R027C":"Ne","R027D":"Si","R028A":"Ne","R028B":"Fe","R028C":"Te","R028D":"Fi","R029A":"Fe","R029B":"Ni","R029C":"Se","R029D":"Ti","R030A":"Ne","R030B":"Si","R030C":"Fe","R030D":"Fi","R031A":"Fe","R031B":"Te","R031C":"Ne","R031D":"Ni","R032A":"Fi","R032B":"Te","R032C":"Ne","R032D":"Si","R033A":"Ti","R033B":"Fi","R033C":"Te","R033D":"Ne","R034A":"Ni","R034B":"Si","R034C":"Ne","R034D":"Ti","R035A":"Fe","R035B":"Te","R035C":"Ti","R035D":"Ne","R036A":"Ti","R036B":"Te","R036C":"Fe","R036D":"Fi","R037A":"Se","R037B":"Ni","R037C":"Te","R037D":"Si","R038A":"Se","R038B":"Si","R038C":"Ne","R038D":"Ti","R039A":"Ne","R039B":"Te","R039C":"Ti","R039D":"Se","R040A":"Si","R040B":"Ne","R040C":"Se","R040D":"Ti","R041A":"Se","R041B":"Fe","R041C":"Te","R041D":"Ni","R042A":"Si","R042B":"Se","R042C":"Fe","R042D":"Ni","R043A":"Te","R043B":"Fi","R043C":"Ni","R043D":"Se","R044A":"Ti","R044B":"Ni","R044C":"Ne","R044D":"Si","R045A":"Si","R045B":"Fe","R045C":"Fi","R045D":"Se","R046A":"Si","R046B":"Te","R046C":"Fi","R046D":"Ne","R047A":"Te","R047B":"Ti","R047C":"Fe","R047D":"Fi","R048A":"Ni","R048B":"Se","R048C":"Fe","R048D":"Ti"},"ANCORAS":{"Te":"R039B","Ti":"R014C","Fe":"R036C","Fi":"R020D","Se":"R022B","Si":"R034B","Ne":"R040B","Ni":"R043C"},"DESEMPATES":[{"codigo":"D01","par":["Te","Ti"],"e":"Um procedimento em uso apresenta falhas recorrentes. Você tem autonomia para agir. O que faz primeiro?","a":[{"p":"Te","t":"Escrevo a versão corrigida do procedimento e coloco em uso, ajustando o que aparecer depois."},{"p":"Ti","t":"Estudo por que ele falha antes de propor qualquer substituição, mesmo que isso leve tempo."}]},{"codigo":"D02","par":["Te","Fe"],"e":"Uma entrega atrasou e há desconforto entre as pessoas envolvidas. Por onde você começa?","a":[{"p":"Te","t":"Pelo combinado: retomo prazos e responsabilidades, e reorganizo o que ficou pendente."},{"p":"Fe","t":"Pelas pessoas: converso com quem está desconfortável antes de tratar da entrega."}]},{"codigo":"D03","par":["Te","Fi"],"e":"Você recebe uma orientação que considera equivocada, mas legítima. Como se posiciona?","a":[{"p":"Te","t":"Cumpro e registro formalmente minha divergência, para que fique documentada."},{"p":"Fi","t":"Cumpro no que não contraria o que acredito, e não finjo concordar no restante."}]},{"codigo":"D04","par":["Te","Se"],"e":"Um problema urgente aparece e a equipe está dispersa. Qual é o seu primeiro movimento?","a":[{"p":"Te","t":"Defino quem cuida do quê e em que ordem, antes de qualquer um começar a agir."},{"p":"Se","t":"Começo a resolver a parte mais crítica eu mesmo, e organizo o resto no caminho."}]},{"codigo":"D05","par":["Te","Si"],"e":"Você assume a coordenação de um trabalho que já vinha sendo feito de outra forma. Como conduz?","a":[{"p":"Te","t":"Estabeleço a estrutura que considero correta e comunico o novo funcionamento."},{"p":"Si","t":"Mantenho o que já funcionava e mudo apenas o que se mostrar necessário."}]},{"codigo":"D06","par":["Te","Ne"],"e":"A equipe precisa de uma saída para um problema que se repete. O que você traz?","a":[{"p":"Te","t":"Uma proposta fechada, com etapas, responsáveis e prazo, pronta para ser decidida."},{"p":"Ne","t":"Várias direções possíveis, para que a equipe escolha antes de fechar qualquer uma."}]},{"codigo":"D07","par":["Te","Ni"],"e":"Há uma decisão a tomar e o cenário à frente não está claro. Como você se apoia?","a":[{"p":"Te","t":"No critério que já usamos em casos parecidos — decido e sigo, revisando se mudar."},{"p":"Ni","t":"Na leitura de onde isso vai desembocar, mesmo que ainda não haja evidência disso."}]},{"codigo":"D08","par":["Ti","Fe"],"e":"Você identifica um erro no trabalho apresentado por um colega diante do grupo. Como age?","a":[{"p":"Ti","t":"Aponto o erro com precisão, porque deixá-lo passar comprometeria o resultado."},{"p":"Fe","t":"Trato depois, em separado, para não expor a pessoa na frente de todos."}]},{"codigo":"D09","par":["Ti","Fi"],"e":"Uma escolha pode ser defendida por argumento técnico ou por convicção pessoal. Qual pesa mais?","a":[{"p":"Ti","t":"O argumento: se ele não se sustenta, minha convicção também não deveria."},{"p":"Fi","t":"A convicção: há coisas que sustento mesmo sem conseguir demonstrar por raciocínio."}]},{"codigo":"D10","par":["Ti","Se"],"e":"Surge uma abordagem nova para um trabalho que você domina. Como você a avalia?","a":[{"p":"Ti","t":"Entendo como ela funciona por dentro antes de confiar qualquer coisa a ela."},{"p":"Se","t":"Experimento em pequena escala — descubro mais usando do que analisando."}]},{"codigo":"D11","par":["Ti","Si"],"e":"Um resultado não fechou como esperado. Onde você procura primeiro?","a":[{"p":"Ti","t":"Na lógica: reconstruo o raciocínio até achar onde a premissa não se sustenta."},{"p":"Si","t":"Nos registros: confiro passo a passo o que foi feito até achar onde saiu do padrão."}]},{"codigo":"D12","par":["Ti","Ne"],"e":"Você tem tempo livre para se dedicar a um assunto de trabalho. Como o usa?","a":[{"p":"Ti","t":"Aprofundo um único tema até dominá-lo por inteiro."},{"p":"Ne","t":"Percorro vários temas novos, atrás de conexões que ainda não enxerguei."}]},{"codigo":"D13","par":["Ti","Ni"],"e":"Você precisa avaliar uma proposta complexa. O que examina primeiro?","a":[{"p":"Ti","t":"Se ela é internamente coerente — se as partes se sustentam umas às outras."},{"p":"Ni","t":"Aonde ela chega no longo prazo, mesmo que hoje pareça coerente."}]},{"codigo":"D14","par":["Fe","Fi"],"e":"O grupo caminha para uma decisão com a qual você não concorda. O que você faz?","a":[{"p":"Fe","t":"Busco uma formulação que a maioria consiga aceitar sem que o grupo se divida."},{"p":"Fi","t":"Mantenho minha posição, mesmo ficando sozinho, e não a sustento por fora."}]},{"codigo":"D15","par":["Fe","Se"],"e":"Uma frente de trabalho está parada e a equipe desanimada. Por onde você entra?","a":[{"p":"Fe","t":"Descubro o que desanimou o grupo e trato disso antes de retomar o trabalho."},{"p":"Se","t":"Começo a fazer a primeira coisa concreta — o movimento costuma reanimar por si."}]},{"codigo":"D16","par":["Fe","Si"],"e":"Você vai distribuir tarefas em um trabalho coletivo. O que orienta a divisão?","a":[{"p":"Fe","t":"Onde cada pessoa vai se sentir útil e disposta a contribuir."},{"p":"Si","t":"Quem já fez aquilo bem antes e tem prática comprovada na tarefa."}]},{"codigo":"D17","par":["Fe","Ne"],"e":"Você tem uma conversa com alguém de outra área. O que busca nela?","a":[{"p":"Fe","t":"Construir uma relação de confiança que facilite o trabalho conjunto depois."},{"p":"Ne","t":"Descobrir oportunidades e cruzamentos entre o que cada um faz."}]},{"codigo":"D18","par":["Fe","Ni"],"e":"A equipe está sobrecarregada e o desgaste começa a aparecer. Do que você cuida?","a":[{"p":"Fe","t":"Do clima agora: sem as pessoas inteiras, nada mais anda."},{"p":"Ni","t":"Da causa de fundo: enquanto ela ficar, a sobrecarga volta em outra forma."}]},{"codigo":"D19","par":["Fi","Se"],"e":"Sob pressão intensa, o que costuma acontecer com você?","a":[{"p":"Fi","t":"Fico mais quieto — processo por dentro antes de me manifestar."},{"p":"Se","t":"Fico mais em movimento — quando aperta, eu ajo."}]},{"codigo":"D20","par":["Fi","Si"],"e":"Você precisa entregar algo que considera abaixo do que deveria ser. O que sustenta sua recusa?","a":[{"p":"Fi","t":"Não entrego mal aquilo que, para mim, não se entrega mal — é questão de princípio."},{"p":"Si","t":"Não entrego fora do padrão combinado — é questão de conferência e método."}]},{"codigo":"D21","par":["Fi","Ne"],"e":"Você tem uma ideia que ainda não convenceu ninguém. O que faz com ela?","a":[{"p":"Fi","t":"Sigo sustentando por conta própria, sem transformar isso em campanha."},{"p":"Ne","t":"Levo a mais gente e a outros lugares até encontrar quem se interesse."}]},{"codigo":"D22","par":["Fi","Ni"],"e":"Você percebe algo importante que o grupo ainda não vê. Como se manifesta?","a":[{"p":"Fi","t":"Digo se me pedirem, e sustento na prática mesmo que não me perguntem."},{"p":"Ni","t":"Digo uma vez, com clareza, e não insisto — quando ficar visível, vão lembrar."}]},{"codigo":"D23","par":["Se","Si"],"e":"Você precisa decidir sobre algo concreto e há alguma margem de risco. Como resolve?","a":[{"p":"Se","t":"Testo logo, em escala pequena, e deixo o resultado decidir."},{"p":"Si","t":"Verifico tudo antes de mover — sob pressa é que o erro passa."}]},{"codigo":"D24","par":["Se","Ne"],"e":"Um trabalho novo vai começar e nada está definido ainda. Qual é a sua entrada?","a":[{"p":"Se","t":"Faço a primeira coisa concreta possível hoje, e o resto vem atrás."},{"p":"Ne","t":"Levanto os caminhos possíveis antes de fechar por onde começar."}]},{"codigo":"D25","par":["Se","Ni"],"e":"Uma urgência aparece pela terceira vez no mês. O que você faz agora?","a":[{"p":"Se","t":"Resolvo a urgência da vez — o padrão a gente discute depois, com calma."},{"p":"Ni","t":"Paro e trato do que está gerando as urgências, mesmo com esta ainda aberta."}]},{"codigo":"D26","par":["Si","Ne"],"e":"Propõem trocar um processo que funciona por outro ainda não testado aqui. Qual é a sua posição?","a":[{"p":"Si","t":"Rodar os dois em paralelo antes de abandonar o que já se mostrou confiável."},{"p":"Ne","t":"Adotar o novo: o atual já mostrou seu limite e o outro abre caminhos."}]},{"codigo":"D27","par":["Si","Ni"],"e":"Pedem seu parecer sobre um plano detalhado. O que você olha primeiro?","a":[{"p":"Si","t":"Se os detalhes fecham: prazos, responsáveis e o que depende do quê."},{"p":"Ni","t":"Se a direção está certa — plano bem-feito na direção errada continua errado."}]},{"codigo":"D28","par":["Ne","Ni"],"e":"Um projeto ainda em fase de ideia chega até você. Como você contribui?","a":[{"p":"Ne","t":"Trago referências e combinações de fora que ninguém tinha considerado."},{"p":"Ni","t":"Aponto no que aquilo pode se transformar, mesmo sem sinal disso ainda."}]}],"PERFIS":[{"id":"Te","animal":"Lobo","nomeJung":"Pensamento Extrovertido","cor":"#2E6E8E","atitude":"E","funcao":"T","funcaoInferiorNome":"Sentimento","sintese":"Organiza a realidade externa por critério lógico e espera que o sistema seja seguido.","estrutura":{"percebe":"Lê o campo como terreno operacional: posições, papéis, sequências e pontos de falha. Vê primeiro a estrutura, depois as pessoas.","decide":"Por critério explícito e antecipado. Planeja a rota antes de andar e escolhe o caminho de menor exposição, não o mais rápido. Revisa diante de dado novo, não diante de pressão afetiva.","relaciona":"Vincula-se pela função e pela confiabilidade. A lealdade é real e sustentada, mas se expressa em provisão e proteção, não em manifestação afetiva."},"potencias":["Transforma intenção difusa em processo executável","Cria clareza de papéis e reduz retrabalho","Sustenta padrão de qualidade e cobra o combinado","Coordena esforços coletivos com naturalidade","Persiste em esforço longo quando enxerga a lógica dele"],"luzSombra":[{"forca":"Clareza de critério","equilibrada":"Decisões auditáveis que a equipe consegue reproduzir sozinha","excessiva":"Rigidez: exceção legítima passa a ser lida como corrupção do sistema"},{"forca":"Objetividade","equilibrada":"Separa o problema da pessoa e despersonaliza o conflito","excessiva":"Desconsideração: o custo humano do que é tecnicamente correto deixa de ser registrado"},{"forca":"Capacidade de organizar os outros","equilibrada":"Coordenação que multiplica o esforço coletivo","excessiva":"Autoritarismo: o próprio sistema é aplicado a quem não o compartilha"},{"forca":"Orientação a resultado","equilibrada":"Foco sustentado que atravessa o cansaço da equipe","excessiva":"Voracidade — \"obter tudo sem considerar os meios\" — em que a própria inteligência tática se degrada"}],"luz":"Equilibrado, é a função que torna o esforço coletivo possível: transforma intenção difusa em operação, distribui papéis, sustenta padrão e protege quem está fragilizado dentro do sistema que construiu. No livro esse polo aparece como guardião, guia e psicopompo — \"um animal que conhece a agressividade e a crueldade\" e é forte o bastante para afastá-la. A firmeza é serviço, não domínio.","sombra":"A sombra é o sentimento inferior e aparece de duas formas opostas. Na primeira, o valor do outro não é registrado: vence \"sem dar ouvidos à sua argumentação lógica\", e o rigor vira desconsideração. Na segunda, o afeto recalcado retorna cru — a frieza que carrega raiva reprimida por trás. Não é um perfil pior: é o mesmo perfil com a função inferior no comando.","contribuicoes":["Converte decisão coletiva em operação que sobrevive à semana seguinte","Define papéis, limites e sequência quando o escopo está difuso","Sustenta o padrão combinado sem depender de vigilância externa","Protege a equipe de decisões arbitrárias exigindo critério explícito"],"menosEspontaneos":["Registrar o efeito das decisões sobre as pessoas envolvidas","Reconhecer contribuições informais que não aparecem em processo","Sustentar ambiguidade sem apressar uma estrutura"],"complementaridade":"Complementa-se com recursos voltados ao valor humano da decisão e à leitura do clima — quem pergunta \"quem é afetado por isto?\" antes de o critério fechar. E com recursos de percepção de possibilidade, que evitam que o sistema construído se torne o único horizonte considerado.","trabalho":{"decisao":"Rápida quando o critério está claro; travada quando não está. Muda diante de argumento, não diante de pressão emocional.","comunicacao":"Direta, impessoal e orientada ao problema. Argumenta por dado, precedente e consistência. Faz perguntas de verificação que soam como interrogatório sem essa intenção.","execucao":"Organiza antes de executar. Com escopo e limite explícitos, preenche o resto sozinho.","mudanca":"Aceita mudança bem fundamentada e resiste à anunciada sem critério. O que rejeita não é o novo — é o arbitrário.","conflitos":"Enfrenta pelo mérito e despersonaliza, o que ajuda no conteúdo e machuca na forma. Frequentemente não percebe que houve conflito.","relacionamento":"Confiável e protetor com quem está dentro do sistema. Pouca manifestação afetiva, muita provisão concreta.","pressao":"Endurece: aumenta controle, encurta prazos e reduz consulta.","inovacao":"Inova por otimização e redesenho, raramente por ruptura. Melhora o que existe até uma ordem de grandeza.","organizacao":"Alta. É frequentemente a infraestrutura organizacional invisível da equipe."}},{"id":"Ti","animal":"Elefante","nomeJung":"Pensamento Introvertido","cor":"#1C4A62","atitude":"I","funcao":"T","funcaoInferiorNome":"Sentimento","sintese":"Constrói e guarda a arquitetura conceitual do trabalho; move-se devagar e com muito peso.","estrutura":{"percebe":"Por sondagem e a distância, não pelo imediatamente visível. Registra o padrão de fundo e a memória do que já ocorreu.","decide":"Devagar e por coerência interna, não por consenso nem urgência. \"Achou justo o pedido e encontrou outro acesso ao lago\": julga por princípio e refaz a rota inteira se o princípio exigir.","relaciona":"Poucos vínculos, profundos e duradouros. A autossuficiência é estrutural — e o livro a critica: \"embora possa sustentar o peso de todos, não é sustentado por ninguém\"."},"potencias":["Antecipa a falha de arquitetura que ninguém viu","É a memória institucional viva da equipe","Eleva o padrão intelectual da discussão","Produz o modelo ou padrão que outros usarão por anos","Submete a própria força a um princípio — poder que aceita limite"],"luzSombra":[{"forca":"Profundidade analítica","equilibrada":"Evita o retrabalho caro identificando o erro estrutural cedo","excessiva":"Sobre-análise: a versão boa o suficiente nunca chega"},{"forca":"Memória longa","equilibrada":"Impede que a organização repita decisões já testadas","excessiva":"Precedente usado como veto: \"já tentamos\" bloqueia o que mudou de contexto"},{"forca":"Autonomia intelectual","equilibrada":"Pensa por conta própria e não cede a pressão de moda","excessiva":"Isolamento estrutural: sustenta todos e não é sustentado por ninguém"},{"forca":"Exigência de coerência","equilibrada":"Padrão elevado que puxa o time inteiro","excessiva":"Arrogância — o \"ser arrogante e onipotente\" de La Fontaine — e persona inflada como defesa"}],"luz":"Equilibrado, é o guardião do que sustenta o resto: a arquitetura conceitual, a memória do porquê das regras, o padrão que outros usarão por anos. Ganesha condensa esse polo — aquele que \"abre caminhos e supera obstáculos\". E a formulação decisiva do livro descreve o que ele oferece a uma organização: força que aceita limite, e por isso confiável.","sombra":"A sombra tem o nome que o próprio livro dá: autossuficiência unilateral. Começa como virtude — pensar por conta própria — e termina como isolamento, sustentando todos sem ser sustentado. Daí a arrogância e a persona inflada, \"que quando usada como mecanismo de defesa pode se mostrar inútil\". E há a irrupção: o musth, \"fúria devastadora similar ao comportamento intempestivo das pessoas habitualmente pacatas\" — descrição literal do sentimento inferior deste tipo.","contribuicoes":["Identifica o erro de arquitetura antes que ele custe caro","Guarda e recupera o histórico das decisões e seus motivos","Produz documentação e padrões que sobrevivem a mudanças de equipe","Sustenta o rigor conceitual quando a pressa quer atalho"],"menosEspontaneos":["Traduzir a própria análise para quem não compartilha o repertório","Entregar uma versão parcial dentro de um prazo curto","Sinalizar desacordo cedo, em pequeno grau, antes que vire posição definitiva"],"complementaridade":"Complementa-se com recursos de execução concreta e de tradução — quem converte modelo em passo verificável e leva o conteúdo à circulação. E com recursos de leitura do clima, que reduzem o custo relacional de sua exigência de coerência.","trabalho":{"decisao":"Lenta e por coerência interna. Precisa reconstruir o raciocínio inteiro para concordar; uma vez decidido, dificilmente reabre.","comunicacao":"Fala pouco e denso; quando fala, a discussão muda de nível. Prefere texto a reunião. Não disputa espaço de fala.","execucao":"Em profundidade e em ritmo próprio. Precisa de blocos longos; agenda fragmentada destrói sua contribuição principal.","mudanca":"Resistente à mudança de forma, receptivo à mudança de fundamento. Recusa ajuste cosmético.","conflitos":"Evita o atrito enquanto pode e depois sustenta a posição com peso desproporcional. O conflito irrompe já grande.","relacionamento":"Generoso com quem pede ajuda; invisível para o resto. Vínculos poucos e duradouros.","pressao":"Retrai-se e aprofunda, o que agrava o atraso. Períodos raros de irritação intensa em alguém habitualmente plácido.","inovacao":"No nível do modelo, não do produto. Sua contribuição costuma ser reconhecida anos depois, quando já virou infraestrutura.","organizacao":"Alta no plano conceitual, baixa no plano operacional cotidiano."}},{"id":"Fe","animal":"Carneiro","nomeJung":"Sentimento Extrovertido","cor":"#C1663A","atitude":"E","funcao":"F","funcaoInferiorNome":"Pensamento","sintese":"Orienta-se pelos valores compartilhados do grupo e trabalha para manter o vínculo coletivo íntegro.","estrutura":{"percebe":"Pelo estado do vínculo: quem está desconfortável, o que se rompeu, o que ainda não foi dito. Lê o clima antes de ler o conteúdo.","decide":"Por adesão e por impacto nas pessoas. Busca consenso antes de posição — decisões estáveis, porém lentas. Sob dúvida, adota o critério de quem tem mais convicção.","relaciona":"É o tecido conectivo. Integra, medeia e assume a parte ingrata sem que peçam."},"potencias":["Sustenta a confiança que permite ao time discordar sem se romper","Detecta desengajamento e sofrimento antes de qualquer indicador","Faz o onboarding real acontecer","Traduz decisões duras em linguagem que o time consegue receber","Adapta-se a contextos e culturas muito diferentes com facilidade rara"],"luzSombra":[{"forca":"Leitura do clima","equilibrada":"Antecipa ruptura de vínculo antes que ela custe pessoas","excessiva":"Absorção invisível do desconforto alheio até o esgotamento"},{"forca":"Busca de harmonia","equilibrada":"Mantém o grupo capaz de divergir sem se romper","excessiva":"Diluição da própria posição; a discordância migra para o corredor"},{"forca":"Disponibilidade","equilibrada":"Cobre lacunas que ninguém quer cobrir","excessiva":"Sobrecarga silenciosa e o ressentimento que o livro registra: \"com as atitudes de vítima e sacrifício, em geral coexistem sentimentos de ódio\""},{"forca":"Adaptabilidade","equilibrada":"Funciona bem em qualquer contexto ou cultura","excessiva":"Inércia diante da hostilidade — deixa de reagir quando reagir seria necessário"}],"luz":"Equilibrado, é a função que mantém o grupo capaz de discordar sem se romper. O livro descreve esse polo como obediência madura — não submissão defensiva, mas a capacidade de adaptar-se também \"à autoridade do Self\" — e reconhece que \"o comportamento imitativo e adaptativo ao meio social é imprescindível para a estruturação do ego\". A adesão não é fraqueza; é fase necessária.","sombra":"A sombra do carneiro é a mais mal compreendida, porque não se parece com uma sombra. Começa onde a adaptação deixa de ser escolha e \"se torna defensiva, e paralisa a criatividade\". A forma extrema é a inércia. Mas o material mais desconfortável é outro: o livro afirma que quem age \"como um cordeiro manso\" pode \"exercer um poder inconsciente sobre os outros\". A docilidade tem uma face de poder — e é por não ser reconhecida como tal que ela opera. O pensamento inferior fecha o quadro: julgamentos rígidos e categóricos sobre a intenção alheia, num perfil habitualmente flexível.","contribuicoes":["Cria a segurança psicológica sem a qual não há divergência produtiva","Integra pessoas novas e reconstrói vínculos rompidos","Comunica decisões difíceis de modo que o time consiga recebê-las","Sinaliza desgaste humano muito antes de ele virar rotatividade"],"menosEspontaneos":["Formar e sustentar posição própria antes de consultar o grupo","Recusar demandas explicitamente e nomear o próprio limite","Aplicar critério técnico quando ele contraria a preferência do grupo"],"complementaridade":"Complementa-se com recursos de critério explícito e de análise, que dão lastro técnico às suas leituras relacionais. E com recursos de posicionamento firme, que ajudam a converter percepção de clima em decisão.","trabalho":{"decisao":"Por consenso e por impacto nas pessoas. Estável e lenta.","comunicacao":"Calorosa, afirmativa e atenta ao efeito. Suaviza a mensagem para preservar a relação — às vezes ao ponto de perdê-la.","execucao":"Colaborativa. Rende mais em par ou grupo pequeno do que isolada.","mudanca":"Adapta-se rapidamente e absorve o custo emocional pelos outros — absorção que costuma ser invisível até o esgotamento.","conflitos":"Evita o confronto aberto e leva a discordância para o corredor. O conflito muda de lugar em vez de se resolver.","relacionamento":"Tecido conectivo. Assume a parte ingrata sem que peçam.","pressao":"Cede espaço e aumenta disponibilidade, o que agrava a sobrecarga. Em ambiente hostil, tende à inércia.","inovacao":"Raramente propõe; frequentemente viabiliza. Faz a ideia de outro ser aceita pelo grupo.","organizacao":"Moderada e centrada em pessoas: sabe quem precisa de quê, mais do que qual é o processo."}},{"id":"Fi","animal":"Baleia","nomeJung":"Sentimento Introvertido","cor":"#8C3F33","atitude":"I","funcao":"F","funcaoInferiorNome":"Pensamento","sintese":"Sustenta um sistema de valores interno, profundo e pouco verbalizado, que orienta suas escolhas com firmeza silenciosa.","estrutura":{"percebe":"Em profundidade e a distância. Registra muito antes de manifestar, e manifesta pouco do que registra.","decide":"Por congruência com o próprio sistema de valores, mesmo contra a maioria e sem explicitar a razão da recusa. Processa no próprio tempo; uma vez alinhada, sustenta com constância subestimada.","relaciona":"Vínculo denso e discreto. Não abandona quem está ferido — o cuidado é ação, não declaração."},"potencias":["É a consciência ética da equipe: freia o atalho que ninguém quer nomear","Estabilidade emocional em momentos de crise e ruído","Escuta de altíssima qualidade","Cria segurança pela previsibilidade do próprio caráter","Sustenta compromissos de longo prazo sem supervisão"],"luzSombra":[{"forca":"Convicção ética firme","equilibrada":"Freio confiável antes que o dano aconteça","excessiva":"Autoridade moral não declarada que, segundo o livro, \"pode levar à repressão do menor e mais frágil\""},{"forca":"Discrição","equilibrada":"Presença estável que não disputa espaço nem cria ruído","excessiva":"Invisibilidade: a contribuição não é reconhecida e a divergência nunca chega à mesa"},{"forca":"Profundidade de vínculo","equilibrada":"Confiança que faz as pessoas trazerem o que não trazem a mais ninguém","excessiva":"Presença que envolve e retém — o polo de sedução que o livro registra"},{"forca":"Processamento interno prolongado","equilibrada":"Decisões maduras e sustentadas ao longo do tempo","excessiva":"Ressentimento acumulado que só aparece já como decisão de saída"}],"luz":"Equilibrada, exerce o que o capítulo junguiano chama de influência moral: não pelo discurso, mas pela coerência. É a estabilidade que segura o ambiente quando tudo acelera e a escuta a quem se conta o que não se conta a mais ninguém. No livro, é salvadora e guia — impede o encalhe e conduz o barco ao porto — e \"a força que, quando positivamente canalizada, conduz e dirige a psique para o plano consciente\".","sombra":"A sombra é a mesma profundidade sem via de saída. O livro registra a insaciabilidade — \"há sempre um buraco não preenchido\" — e é dela que nasce a forma organizacional mais comum: o ressentimento acumulado em silêncio, que só aparece como decisão já tomada. Há também o polo do disfarce: \"simboliza aquele que se disfarça e engana\", parece ilha e afunda com quem se instalou sobre ela. O pensamento inferior aparece quando finalmente se explica: argumentação rígida, dados usados como arma, frieza atípica.","contribuicoes":["Sinaliza o custo ético de decisões que pareciam apenas técnicas","Estabiliza a equipe em períodos de crise e alta rotatividade","Oferece escuta que faz problemas emergirem antes de estourarem","Sustenta relações de confiança de longo prazo com pessoas e parceiros"],"menosEspontaneos":["Verbalizar os critérios que já concluiu internamente","Sinalizar desconforto cedo e em pequeno grau, antes que vire ruptura","Ocupar espaço em discussões abertas e disputadas"],"complementaridade":"Complementa-se com recursos de articulação e visibilidade, que levam suas conclusões ao debate coletivo. E com recursos de estruturação, que convertem convicção de valor em critério aplicável.","trabalho":{"decisao":"Por congruência com valores próprios, mesmo isolada. Raramente explicita a razão da recusa.","comunicacao":"Fala pouco, e o que diz reorienta a conversa. Melhor em conversa a dois do que em plenária.","execucao":"Profunda, silenciosa e no próprio tempo. Precisa de material antecipado e de contexto.","mudanca":"Aceita mudança justificada por propósito e resiste à justificada por eficiência. Precisa de tempo e de sentido, nessa ordem.","conflitos":"Não confronta; absorve. A expressão chega tarde, já na forma de uma decisão tomada.","relacionamento":"Presença constante e discreta. Não abandona quem está em dificuldade.","pressao":"Submerge: reduz contato, mantém a entrega e para de sinalizar.","inovacao":"Gesta em silêncio e apresenta pronto. O risco é a organização nunca saber que havia algo sendo gestado.","organizacao":"Moderada, orientada por compromisso assumido mais do que por sistema formal."}},{"id":"Se","animal":"Cavalo","nomeJung":"Sensação Extrovertida","cor":"#6E8B3D","atitude":"E","funcao":"S","funcaoInferiorNome":"Intuição","sintese":"Opera na realidade palpável, com senso agudo do concreto e enorme capacidade de ação imediata.","estrutura":{"percebe":"Amplitude e detalhe simultâneos. Registra o que muda, na hora em que muda.","decide":"Rápido e em gradação de custo: primeiro sinaliza, depois recua, só então confronta. Aprende fazendo, não modelando.","relaciona":"Gregário e responsivo. Lê a menor variação de tom e postura da liderança, mesmo quando não comenta."},"potencias":["Destrava o que está parado e recupera cronograma","Presença firme em campo, com cliente e em operação","Aumenta o ritmo do time inteiro por contágio","Resolve problemas concretos com economia de movimento","Desempenho excepcional em crise e alta pressão sensorial"],"luzSombra":[{"forca":"Senso de realidade","equilibrada":"Ancora a discussão no que efetivamente está acontecendo","excessiva":"Descarte do que ainda não é visível — inclusive do risco que só existe no futuro"},{"forca":"Velocidade de ação","equilibrada":"Tira o trabalho do papel no mesmo dia","excessiva":"Ação que se antecipa à compreensão e multiplica o dano quando o diagnóstico estava errado"},{"forca":"Energia e disposição","equilibrada":"Contagia e sustenta o ritmo coletivo","excessiva":"Atropelamento de perfis mais lentos e desengajamento visível em conversas longas"},{"forca":"Pragmatismo","equilibrada":"Contorna a burocracia que não serve à entrega","excessiva":"Baixa documentação: a equipe refaz o mesmo trabalho por falta de registro"}],"luz":"Equilibrado, é a energia que tira o trabalho do papel — e o livro é explícito sobre a condição disso: trata-se de \"o ímpeto biológico, a energia natural\", massa de energia que \"exige uma direção consciente\" para se tornar produtiva. Com direção, o polo é solar: \"emerge da sombra para a luz\" e chega a representar \"instintos sublimados ou controlados\". O ideal descrito é Quíron, \"a expressão nítida da harmonia do homem com sua instintividade\".","sombra":"A sombra aparece exatamente onde a direção falta. \"A imagem do cavalo desenfreado aponta para a dificuldade de domínio do eu diante da invasão de impulsos inconscientes\" — em termos organizacionais: velocidade que produz dano e energia que não distingue urgência de importância. Há também a indiscriminação, a \"crina embaraçada\" que confunde o pensamento. E a intuição inferior fecha o quadro: pressentimentos catastróficos em alguém habitualmente ancorado no presente.","contribuicoes":["Converte decisão em fato concreto no mesmo dia","Sustenta a operação e o contato direto com a realidade do trabalho","Estabiliza a equipe em crises que exigem resposta imediata","Traz de volta ao concreto discussões que se abstraíram"],"menosEspontaneos":["Antecipar consequências de segunda ordem antes de agir","Planejar e documentar o que descobriu na prática","Sustentar trabalho abstrato de horizonte longo"],"complementaridade":"Complementa-se com recursos de antecipação e de modelagem, que dão direção à sua energia. E com recursos de registro e continuidade, que preservam o que ele descobriu executando.","trabalho":{"decisao":"Rápida, com base no que está diante dos olhos. Prefere testar a modelar; subestima consequências de segunda ordem.","comunicacao":"Objetiva, concreta e cheia de exemplos reais. Prefere mostrar a explicar.","execucao":"Faz. Aprende fazendo. Rende em ciclos curtos com resultado visível.","mudanca":"Adapta-se com facilidade a mudanças concretas; sofre com mudanças de direção estratégica sem tradução prática.","conflitos":"Reage rápido e sinaliza antes de escalar. Intenso, explícito e geralmente curto.","relacionamento":"Contagia o ritmo. Presença disponível e visível.","pressao":"Acelera: faz mais, mais rápido, com menos consulta.","inovacao":"Por experimento e improviso eficaz. Descobre na prática o que não estava no plano — mas não formaliza o que descobre.","organizacao":"Baixa no plano formal, alta no plano prático: sabe onde as coisas estão e como fazê-las andar."}},{"id":"Si","animal":"Urso","nomeJung":"Sensação Introvertida","cor":"#47632B","atitude":"I","funcao":"S","funcaoInferiorNome":"Intuição","sintese":"Percebe o detalhe concreto com precisão incomum e o organiza em um repertório interno estável.","estrutura":{"percebe":"Por proximidade e cheiro, não por varredura à distância. Nota o que mudou, compara com o que já viu, sente antes de nomear.","decide":"Comparando com a experiência concreta acumulada e em ritmo calendárico. Precisa de dado completo; sob objeto desejado, porém, suprime o cálculo de custo e avança.","relaciona":"Vínculo estável, individualizado e de contato. Pequenos grupos, não coletivos amplos."},"potencias":["Qualidade e confiabilidade sustentadas ao longo do tempo","Documentação, rastreabilidade e continuidade operacional","Detecta o erro pequeno que se tornaria caro","Estabiliza o time nos períodos em que todos estão reagindo","Sensibilidade qualitativa: percebe o mal-acabado antes de saber dizer por quê"],"luzSombra":[{"forca":"Atenção ao detalhe","equilibrada":"Precisão e prevenção do erro caro","excessiva":"Perfeccionismo e dificuldade de dar por concluído"},{"forca":"Consistência de padrão","equilibrada":"Qualidade que não oscila com o humor da semana","excessiva":"Resistência à mudança necessária por apego ao que funcionou"},{"forca":"Memória operacional","equilibrada":"Contexto recuperável que economiza meses de retrabalho","excessiva":"Excesso de detalhe em comunicações que pediam síntese"},{"forca":"Confiabilidade","equilibrada":"É a base sobre a qual a operação não desmorona","excessiva":"Sobrecarga silenciosa por acumular o que ninguém mais quer sustentar"}],"luz":"Equilibrado, é a base sobre a qual a operação não desmorona: qualidade constante, memória do detalhe, continuidade quando todos estão reagindo. O livro concentra esse polo na função de cura — o xamã que \"podia assumir a forma do urso\" — e dá à sua retração o sentido produtivo que raramente se lhe reconhece: a hibernação é a etapa em que conteúdos são \"gestados\", e a saída dela \"pode representar o surgimento da criatividade\". O recolhimento não é ausência de trabalho: é onde este perfil trabalha.","sombra":"A sombra tem duas direções. A primeira é a ingenuidade que o livro documenta exaustivamente e define com precisão: não é falta de inteligência, é não imaginar o que o outro está planejando — crença literal na palavra alheia e aplicação de regra por inversão mecânica sem compreender o caso concreto. É a intuição inferior em estado puro. A segunda é o descontrole da própria potência: o berserk, e a fábula em que mata quem ama \"por não conseguir conhecer e usar adequadamente a própria força\".","contribuicoes":["Garante que o que foi construído continue funcionando","Produz o registro e a rastreabilidade que a equipe usa depois","Identifica antecipadamente o que vai quebrar quando a mudança chegar à operação","Mantém o padrão de qualidade sem depender de cobrança"],"menosEspontaneos":["Considerar cenários que ainda não se materializaram","Sintetizar: entregar as três linhas principais antes do detalhe","Ler a intenção estratégica por trás do pedido de outra pessoa"],"complementaridade":"Complementa-se com recursos de percepção de possibilidade, que ampliam seu horizonte além do precedente. E com recursos de articulação, que traduzem seu conhecimento operacional para quem decide.","trabalho":{"decisao":"Por comparação com a experiência concreta: \"já vimos isso antes, e deu nisto\". Desconfia de decisão sem precedente.","comunicacao":"Fala pouco e com precisão factual. Comunica por registro escrito e histórico. Levanta a inconsistência no fim da reunião.","execucao":"Metódica, no próprio ritmo e com reserva acumulada de dados, versões e contexto.","mudanca":"O ponto mais sensível. Mudança súbita é vivida como perda. Precisa de aviso antecipado e motivo demonstrado.","conflitos":"Evita, acumula e expressa tarde, por acúmulo de evidências. A reação parece desproporcional ao gatilho aparente.","relacionamento":"Estabilizador. Assume silenciosamente o que ninguém quer sustentar.","pressao":"Fecha-se e reduz o escopo ao que domina. Surge catastrofismo difuso em alguém habitualmente ancorado.","inovacao":"Baixa iniciativa de ruptura, alta contribuição de viabilidade: identifica o que vai quebrar na operação real.","organizacao":"Muito alta. É frequentemente quem sabe onde tudo está."}},{"id":"Ne","animal":"Raposa","nomeJung":"Intuição Extrovertida","cor":"#8A5AA0","atitude":"E","funcao":"N","funcaoInferiorNome":"Sensação","sintese":"Fareja possibilidades no mundo externo e converte contexto em oportunidade.","estrutura":{"percebe":"Relações e aberturas onde os outros veem obstáculo. Lê o campo externo como campo de possibilidades.","decide":"Por leitura de cenário e percepção de janela, com alta tolerância a risco e a informação incompleta. Muda de decisão sem constrangimento quando o cenário muda.","relaciona":"Por articulação e persuasão. Rede ampla construída sem esforço aparente."},"potencias":["Traz para dentro da organização o que está acontecendo fora","Gera opções onde o time via um beco sem saída","Abre portas, parcerias e caminhos que não existiam","Recoloca em movimento projetos empacados por excesso de estrutura","Improviso de alta qualidade em contexto novo"],"luzSombra":[{"forca":"Visão de possibilidades","equilibrada":"Inovação e saída não óbvia no impasse","excessiva":"Dispersão: inicia muito, sustenta pouco — \"raras vezes colhem o que plantam\""},{"forca":"Persuasão","equilibrada":"Faz uma ideia boa ser adotada antes de estar pronta","excessiva":"Manipulação — no volume 1, a possibilidade percebida é sempre convertida em engano do outro"},{"forca":"Versatilidade","equilibrada":"Funciona bem em contexto ambíguo e desconhecido","excessiva":"Compromissos verbais sem lastro, que corroem a própria credibilidade"},{"forca":"Energia de início","equilibrada":"Destrava o que estava parado","excessiva":"Sobrecarga de quem executa: a equipe paga o custo do que foi prometido"}],"luz":"Equilibrada, é a função que abre caminhos que não existiam. O livro atribui à \"força da idéia criativa\" o poder de vencer o que a força bruta não vence — e a raposa é sua principal portadora. Há uma imagem que fixa esse polo: no mito Kaska, depois de todos os animais planejarem juntos a artimanha, é ela quem leva o fogo para as tribos. Não é a guardiã do fogo, é quem o distribui — converte um bem retido em recurso comum.","sombra":"A sombra é a única que o volume 1 mostra por inteiro, porque ali ela aparece sempre do lado de quem engana: convence Ysengrin a mergulhar o rabo no lago gelado, escapa do poço fazendo o lobo descer pela corda, mata o jaguar persuadindo-o a deixar que lhe retirem o coração. É inteligência de cenário sem compromisso com o outro — o risco organizacional de articular narrativas que funcionam melhor do que são verdadeiras. E a sensação inferior: perde a leitura do próprio corpo, do próprio limite e do custo real do que promete.","contribuicoes":["Identifica oportunidades e riscos externos antes que apareçam nos números","Produz alternativas quando o caminho conhecido se esgotou","Articula parcerias, contatos e recursos fora da fronteira da equipe","Destrava negociações e impasses por reenquadramento"],"menosEspontaneos":["Concluir e sustentar o que iniciou","Trabalhar com detalhe, processo e prestação de contas","Reconhecer o próprio limite de carga antes do esgotamento"],"complementaridade":"Complementa-se com recursos de consistência e de detalhe, que sustentam o que ela abre. E com recursos de critério, que separam a boa oportunidade da narrativa persuasiva.","trabalho":{"decisao":"Por percepção de janela e leitura de cenário. Muda de decisão sem constrangimento — o que os outros leem como falta de palavra.","comunicacao":"Envolvente, associativa e persuasiva. Vende a ideia antes de a ideia existir. Salta entre assuntos seguindo conexões que só ela viu.","execucao":"Em muitas frentes e em rajadas. Excelente no início e na virada; fraca na sustentação.","mudanca":"Prospera na mudança e a provoca. Às vezes cria movimento sem necessidade, apenas para haver movimento.","conflitos":"Contorna em vez de enfrentar; reenquadra e encontra saída lateral. Torna-se evasiva quando o conflito precisava ser tido.","relacionamento":"Energiza e conecta. Mas a equipe paga o custo de execução do que ela promete.","pressao":"Multiplica opções e abre novas frentes — o oposto do que a situação pede. Perde a leitura do próprio cansaço.","inovacao":"Inovação por descoberta externa. Raramente é quem termina a inovação que iniciou.","organizacao":"Baixa. Precisa de estrutura emprestada de outros perfis."}},{"id":"Ni","animal":"Onça","nomeJung":"Intuição Introvertida","cor":"#4E3163","atitude":"I","funcao":"N","funcaoInferiorNome":"Sensação","sintese":"Enxerga o desdobramento profundo das coisas antes que haja evidência dele.","estrutura":{"percebe":"Vê onde os outros não veem — a visão noturna que sustenta, no livro, a atribuição de clarividência e a possibilidade \"de iluminar o inconsciente, de ver o desconhecido\".","decide":"A partir de convicção interna sobre o desdobramento futuro, depois de espera prolongada. A ação, quando vem, é súbita e total; sob contestação, escala em vez de reavaliar.","relaciona":"Solitária por estrutura, não por circunstância. O vínculo profundo existe, mas é episódico e não organiza sua conduta."},"potencias":["Antecipa mudança de mercado, risco estrutural e ruptura de modelo","Enxerga a dinâmica política e emocional que ninguém verbalizou","Formula a visão e a narrativa de longo prazo","Faz a pergunta que reposiciona o problema inteiro","Paciência incomum: espera o momento e age de uma só vez"],"luzSombra":[{"forca":"Antecipação de cenários","equilibrada":"Vê a ruptura antes de haver evidência dela","excessiva":"Descarte do dado presente que contraria a leitura de longo prazo"},{"forca":"Convicção","equilibrada":"Sustenta a visão quando o consenso ainda não existe","excessiva":"Escalada em vez de reavaliação — \"quanto mais se debate, mais aumenta o ferimento\""},{"forca":"Autonomia","equilibrada":"Pensa fora do enquadramento coletivo","excessiva":"Isolamento e perda de influência por não construir base de apoio"},{"forca":"Leitura do não-dito","equilibrada":"Nomeia a dinâmica que o grupo evita","excessiva":"Ingenuidade prática: subestima o pequeno e \"avalia mal os próprios limites\""}],"luz":"Equilibrada, é a função que antecipa a mudança antes de haver evidência dela. O livro reúne esse polo em quatro figuras convergentes: clarividente, psicopompo, xamã — \"o pajé representa para a sociedade exatamente o mesmo que o jaguar representa para a natureza\" — e guardião do fogo, \"símbolo de transformação cultural\". Vale reter que ela não inventa o fogo: é \"seu guardião, depositário e o primeiro a utilizá-lo\".","sombra":"A sombra tem uma face esperada e outra que surpreende. A esperada é a destrutividade: \"agressividade destemida e traiçoeira é o aspecto central de seu simbolismo\". A inesperada — e mais útil — é a ingenuidade. O livro afirma que \"é somente por meio desse seu ponto fraco que a onça pode ser derrotada\" e a define: credulidade diante de propostas vantajosas, incapacidade de prever a estratégia do outro, e desprezo pelo fraco. É a sensação inferior: quem enxerga longe deixa de ver o que está diante de si. O livro também aponta a saída, e ela é concreta: a consciência perdida \"só é restaurada pelo reconhecimento do valor do menor, do mais humilde, do mais frágil\".","contribuicoes":["Sinaliza risco estrutural e mudança de modelo antes dos indicadores","Formula a visão de longo prazo e a narrativa que dá sentido ao esforço","Nomeia a dinâmica implícita que trava o grupo","Reposiciona problemas que a equipe vinha tentando resolver no enquadramento errado"],"menosEspontaneos":["Traduzir a visão em um passo concreto e verificável do trimestre","Construir base de apoio antes de sustentar uma posição","Sustentar o detalhe operacional e o presente concreto"],"complementaridade":"Complementa-se com recursos de execução e de concretização, que dão corpo à visão. E com recursos de articulação e de leitura de clima, que constroem a adesão de que ela não cuida.","trabalho":{"decisao":"Por convicção interna sobre o desdobramento futuro. Não negocia bem a própria visão.","comunicacao":"Por imagem, cenário e síntese, frequentemente sem mostrar o percurso. A conclusão chega sem a demonstração.","execucao":"Sozinha, em silêncio e por longos períodos de aparente inatividade, seguidos de contribuição concentrada.","mudanca":"Não reage à mudança: costuma tê-la previsto antes. A dificuldade é sustentar o presente enquanto espera o cenário que enxergou.","conflitos":"Raramente entra; quando entra, não recua.","relacionamento":"Presença intermitente. Cala-se em reuniões operacionais e intervém uma vez, deslocando toda a discussão.","pressao":"Isola-se e endurece a convicção. Surge descuido com o corpo e o ambiente, ou fixação em detalhe irrelevante.","inovacao":"É a fonte da inovação de ruptura e a menos capaz de executá-la sozinha.","organizacao":"Baixa no operacional. Indiferente ao processo — não por rebeldia, por desinteresse."}}],"ESTRUTURA":[{"contrato":"MEC","setores":["Coordenação Pedagógica","Suporte Escolar"]},{"contrato":"MDHC","setores":["Atendimento","Projetos Sociais"]},{"contrato":"MM","setores":["Operações","Logística"]},{"contrato":"MS","s /* ═══════════════════════════════════════════════════════════════════════
   MOTOR — porta fiel de src/lib/v2/apuracao.ts.
   A equivalência entre os dois é verificada por comparação direta: o script
   verifica-demo.mjs roda milhares de conjuntos nos dois e exige resultado
   idêntico. Se divergirem, a demo estaria mostrando outra coisa.
   ═══════════════════════════════════════════════════════════════════════ */
const CONFIGS = ['Te','Ti','Fe','Fi','Se','Si','Ne','Ni'];
const INFO = {
  Te:{atitude:'E',funcao:'T',inferior:'F'}, Ti:{atitude:'I',funcao:'T',inferior:'F'},
  Fe:{atitude:'E',funcao:'F',inferior:'T'}, Fi:{atitude:'I',funcao:'F',inferior:'T'},
  Se:{atitude:'E',funcao:'S',inferior:'N'}, Si:{atitude:'I',funcao:'S',inferior:'N'},
  Ne:{atitude:'E',funcao:'N',inferior:'S'}, Ni:{atitude:'I',funcao:'N',inferior:'S'}
};
const FAIXAS = { DEFINIDA_ESCORE:27, DEFINIDA_MARGEM:8, MODERADA_ESCORE:24,
  MODERADA_MARGEM:2, HIBRIDO_MARGEM:2, BAIXA_AMPLITUDE:14,
  EQUILIBRIO_FUNCOES:6, EQUILIBRIO_ATITUDE:10, CONFLITO_MARGEM:3 };
const ANC = new Set(Object.values(D.ANCORAS));
const arred = n => Math.round(n*10)/10;
const zeros = ks => Object.fromEntries(ks.map(k=>[k,0]));

function ordenar(bruto){
  const fn = zeros(['T','F','S','N']), at = {E:0,I:0};
  for (const c of CONFIGS){ fn[INFO[c].funcao]+=bruto[c]; at[INFO[c].atitude]+=bruto[c]; }
  return [...CONFIGS].sort((x,y)=>
    bruto[y]-bruto[x]
    || fn[INFO[y].funcao]-fn[INFO[x].funcao]
    || at[INFO[y].atitude]-at[INFO[x].atitude]
    || CONFIGS.indexOf(x)-CONFIGS.indexOf(y));
}
function auxiliarDe(dom, bruto){
  const fd = INFO[dom].funcao;
  const oposto = (fd==='T'||fd==='F') ? ['S','N'] : ['T','F'];
  return CONFIGS.filter(c=>oposto.includes(INFO[c].funcao))
    .sort((x,y)=>bruto[y]-bruto[x] || CONFIGS.indexOf(x)-CONFIGS.indexOf(y))[0];
}
function apurar(respostas){
  const porQ = new Map();
  for (const r of respostas){
    if (!D.MAPA[r.alternativaId]) continue;
    if (!r.alternativaId.startsWith(r.questaoId)) continue;
    porQ.set(r.questaoId, r.alternativaId);
  }
  const esc = [...porQ.values()];
  const bruto = zeros(CONFIGS);
  for (const a of esc) bruto[D.MAPA[a]] += (ANC.has(a) ? 2 : 1);
  const total = Object.values(bruto).reduce((a,b)=>a+b,0);
  const rel = zeros(CONFIGS);
  if (total>0) for (const c of CONFIGS) rel[c] = arred(bruto[c]/total*100);

  const at = {E:0,I:0}, fn = zeros(['T','F','S','N']);
  for (const c of CONFIGS){ at[INFO[c].atitude]+=bruto[c]; fn[INFO[c].funcao]+=bruto[c]; }
  const pct = n => total>0 ? arred(n/total*100) : 0;
  const fnRel = zeros(['T','F','S','N']);
  for (const f of ['T','F','S','N']) fnRel[f] = pct(fn[f]);

  const ordem = ordenar(bruto);
  const p1 = ordem[0], p2 = ordem[1];
  const margem = arred(rel[p1]-rel[p2]);
  const amplitude = arred(rel[p1]-rel[ordem[7]]);
  const empateBruto = bruto[p1]===bruto[p2];
  const classificacao =
    margem<=FAIXAS.HIBRIDO_MARGEM ? 'configuracao_equilibrada'
    : (rel[p1]>=FAIXAS.DEFINIDA_ESCORE && margem>=FAIXAS.DEFINIDA_MARGEM) ? 'predominancia_definida'
    : (rel[p1]<FAIXAS.MODERADA_ESCORE && amplitude<FAIXAS.BAIXA_AMPLITUDE) ? 'baixa_aderencia'
    : 'predominancia_moderada';
  const vf = ['T','F','S','N'].map(f=>fnRel[f]);
  const a1 = INFO[p1], b1 = INFO[p2];
  const exigeDesempate = empateBruto || margem<=FAIXAS.HIBRIDO_MARGEM;

  return {
    respostasValidas: esc.length, completo: esc.length===48,
    bruto, relativo: rel, totalPontos: total, ordem,
    atitudes:{E:at.E,I:at.I,relativoE:pct(at.E),relativoI:pct(at.I),
      dominante: at.E>at.I?'E':at.I>at.E?'I':INFO[ordem[0]].atitude},
    funcoes: fn, funcoesRelativas: fnRel,
    eixoCognitivo: arred(fnRel.N-fnRel.S),
    eixoRelacional: arred(fnRel.F-fnRel.T),
    orientacaoEnergia: arred(pct(at.E)-pct(at.I)),
    predominante: p1, secundaria: auxiliarDe(p1,bruto), margem, amplitude, classificacao,
    equilibrioFuncional: Math.max(...vf)-Math.min(...vf) <= FAIXAS.EQUILIBRIO_FUNCOES,
    equilibrioAtitude: Math.abs(pct(at.E)-pct(at.I)) <= FAIXAS.EQUILIBRIO_ATITUDE,
    possivelConflito: a1.atitude!==b1.atitude && a1.funcao===b1.inferior && margem<=FAIXAS.CONFLITO_MARGEM,
    empateBruto, exigeDesempate,
    emDisputa: exigeDesempate ? [p1,p2] : null,
    desempateAplicado: false
  };
}
function aplicarDesempate(ap, escolhida){
  const outra = ap.emDisputa[0]===escolhida ? ap.emDisputa[1] : ap.emDisputa[0];
  return {...ap, predominante: escolhida, secundaria: auxiliarDe(escolhida, ap.bruto),
    ordem: [escolhida, outra, ...ap.ordem.filter(c=>c!==escolhida&&c!==outra)],
    exigeDesempate:false, desempateAplicado:true};
}
const temComplementar = ap =>
  ap.classificacao==='configuracao_equilibrada' || ap.margem <= FAIXAS.MODERADA_MARGEM*2;
